<!doctype html>
<html lang="en">
<head>

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

{{head_extra}}<title>{{title}} · steezy.wav</title>
<link rel="preload" href="fonts/CVSans-Regular.woff2" as="font" type="font/woff2" crossorigin>

<body class="sub">

</div></header>

<div class="wrap">
  <div class="page-hero">

  </div>

  <main class="prose">
{{body}}
  </main>
{{more_html}}

<script>
  (function () {
    var bar = document.querySelector(".bar");
    function on() { bar.classList.toggle("scrolled", window.scrollY > 8); }
    window.addEventListener("scroll", on, { passive: true }); on();
  })();
</script>
</body>
